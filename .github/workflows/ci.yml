name: Storefront, catalog and account checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: sd_owner
          POSTGRES_PASSWORD: ${{ github.run_id }}_${{ github.run_attempt }}
          POSTGRES_DB: sd_catalog_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sd_owner -d sd_catalog_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      CI: 'true'
      APP_ENV: test
      NEXT_TELEMETRY_DISABLED: '1'
      TEST_DATABASE_URL: postgresql://sd_owner:${{ github.run_id }}_${{ github.run_attempt }}@127.0.0.1:5432/sd_catalog_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/ci-database.mjs
      - run: pnpm db:generate
      - run: pnpm test:db
      - run: pnpm auth:local
      - run: pnpm test:accounts
      - run: pnpm checkout:local
      - run: pnpm test:checkout
      - run: pnpm payments:local
      - run: pnpm test:payments
      - run: pnpm admin:local
      - run: pnpm test:admin
      - run: pnpm communications:local
      - run: pnpm test:communications
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm check
      - run: pnpm test:outage
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7
