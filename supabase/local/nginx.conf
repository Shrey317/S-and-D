# Local Auth only. No PostgREST, remote SMTP, public listener or production gateway.
server {
  listen 80;
  access_log off;
  location /auth/v1/ {
    proxy_pass http://auth:9999/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
  }
  location / { return 404; }
}
